services:
  checker:
    build: .
    image: meinwohnticket-checker:latest
    container_name: meinwohnticket-checker
    # Optional: Einstellungen aus einer .env-Datei vorbelegen (die Weboberfläche kommt auch ohne aus).
    # Optional: pre-fill settings from a .env file (the web UI works without one).
    env_file:
      - path: .env
        required: false
    ports:
      # Weboberfläche unter http://localhost:${HOST_PORT:-8080}. Ist 8080 auf Ihrem Computer belegt,
      # HOST_PORT=8585 (oder einen anderen freien Port) in eine .env-Datei neben dieser Datei schreiben.
      # Absichtlich nur auf localhost gebunden; 127.0.0.1 durch 0.0.0.0 ersetzen, um die Oberfläche von
      # anderen Geräten im Netzwerk zu erreichen, und dann UI_PASSWORD in der .env setzen.
      # Web UI at http://localhost:${HOST_PORT:-8080}; change HOST_PORT in .env if 8080 is taken.
      # Bound to localhost on purpose; use 0.0.0.0 plus UI_PASSWORD to reach it from other devices.
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    volumes:
      - checker-data:/data
    restart: unless-stopped
    init: true          # räumt übrig gebliebene Chromium-Prozesse nach einem Login auf / reaps leftover Chromium processes
    shm_size: 512m      # Chromium braucht mehr Shared Memory als Docker standardmäßig gibt / Chromium needs more shared memory
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  checker-data:
